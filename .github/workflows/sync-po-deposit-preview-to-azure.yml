name: One-time AncoTrading PO deposit allocation UI preview sync to Azure

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/sync-po-deposit-preview-to-azure.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anco-po-deposit-azure-sync
  cancel-in-progress: false

jobs:
  sync-ui-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_COMMIT: 3c276e38bf64d29be29305546fbde71c797a8318
      MERGE_BASE: 17781b49c90d2acc0c49c95b2c502014d8f129c2
      AZURE_URL: https://dev.azure.com/vongocnhancd10cntt2/AncoTrading/_git/AncoTrading
      AZURE_PAT: ${{ secrets.AZURE_DEVOPS_PAT || secrets.AZDO_PAT || secrets.ADO_PAT || secrets.AZURE_PAT || secrets.AZURE_DEVOPS_TOKEN }}
    steps:
      - name: Checkout GitHub source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate preview-only source and required files
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            inc-packing-list-invoice.aspx
            Views/chungtuxuatkho/inc-ctxk.aspx
            Views/chungtuxuatkho/master.ascx
            Views/chungtuxuatkhoNV/inc-ctxkNV.aspx
            Views/chungtuxuatkhoNV/master.ascx
            Views/phanbococpo/phanbococpo.ascx
            Views/phanbococpo/phanbococpo.ascx.cs
            Views/phanbococpo/phanbococpo.js
            Views/phanbococpo/phanbococpo.css
            Views/phanbococpo/Controller_PhanBoCocPO.ashx
            Views/phanbococpo/README.md
            docs/database/migrations/20261030_c_packinginvoice_phanbo.sql
          )
          git cat-file -e "$SOURCE_COMMIT^{commit}"
          git cat-file -e "$MERGE_BASE^{commit}"
          for path in "${paths[@]}"; do
            git cat-file -e "$SOURCE_COMMIT:$path"
          done
          git show "$SOURCE_COMMIT:Views/chungtuxuatkhoNV/inc-ctxkNV.aspx" | grep -q 'pb:phanbococpo runat="server"'
          if git show "$SOURCE_COMMIT:inc-packing-list-invoice.aspx" | grep -q 'pb:phanbococpo' || git show "$SOURCE_COMMIT:Views/chungtuxuatkho/inc-ctxk.aspx" | grep -q 'pb:phanbococpo'; then
            echo 'Unexpected preview still present in old Invoice screen.' >&2
            exit 1
          fi
          git show "$SOURCE_COMMIT:Views/phanbococpo/Controller_PhanBoCocPO.ashx" | grep -q 'SELECT OBJECT_ID'
          git show "$SOURCE_COMMIT:Views/phanbococpo/Controller_PhanBoCocPO.ashx" | grep -q 'HttpMethod'
          git show "$SOURCE_COMMIT:Views/phanbococpo/Controller_PhanBoCocPO.ashx" | grep -q 'mdbc.GetConnection'
          git show "$SOURCE_COMMIT:docs/database/migrations/20261030_c_packinginvoice_phanbo.sql" | grep -q 'CREATE TABLE dbo.c_packinginvoice_phanbo'
          echo 'Read-only data access and migration script verified.'

      - name: Merge only preview UI into Azure production master
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$AZURE_PAT" ]; then
            echo 'Missing Azure DevOps PAT secret; Azure deployment was not attempted.' >&2
            exit 1
          fi
          AUTH_HEADER="Authorization: Basic $(printf ':%s' "$AZURE_PAT" | base64 -w0)"
          AZURE_DIR="$RUNNER_TEMP/azure-production"
          git -c "http.extraheader=$AUTH_HEADER" clone --single-branch --branch master --depth 1 "$AZURE_URL" "$AZURE_DIR"

          # Apply only this UI change to known paths, preserving independent Azure edits.
          # Three-way merge conflicts abort before staging or pushing anything.
          paths=(
            inc-packing-list-invoice.aspx
            Views/chungtuxuatkho/inc-ctxk.aspx
            Views/chungtuxuatkho/master.ascx
            Views/chungtuxuatkhoNV/inc-ctxkNV.aspx
            Views/chungtuxuatkhoNV/master.ascx
            Views/phanbococpo/phanbococpo.ascx
            Views/phanbococpo/phanbococpo.ascx.cs
            Views/phanbococpo/phanbococpo.js
            Views/phanbococpo/phanbococpo.css
            Views/phanbococpo/Controller_PhanBoCocPO.ashx
            Views/phanbococpo/README.md
            docs/database/migrations/20261030_c_packinginvoice_phanbo.sql
          )
          for path in "${paths[@]}"; do
            sourcefile="$RUNNER_TEMP/new-$(echo "$path" | tr '/' '_')"
            basefile="$RUNNER_TEMP/base-$(echo "$path" | tr '/' '_')"
            mergedfile="$RUNNER_TEMP/merge-$(echo "$path" | tr '/' '_')"
            git show "$SOURCE_COMMIT:$path" > "$sourcefile"
            mkdir -p "$(dirname "$AZURE_DIR/$path")"
            if git cat-file -e "$MERGE_BASE:$path" 2>/dev/null; then
              if [ ! -f "$AZURE_DIR/$path" ]; then
                echo "Existing source file absent in Azure: $path; refusing to recreate." >&2
                exit 1
              fi
              git show "$MERGE_BASE:$path" > "$basefile"
              if ! git merge-file -p "$AZURE_DIR/$path" "$basefile" "$sourcefile" > "$mergedfile"; then
                echo "Azure merge conflict in $path; no push performed." >&2
                exit 1
              fi
              mv "$mergedfile" "$AZURE_DIR/$path"
            else
              if [ -f "$AZURE_DIR/$path" ] && ! cmp -s "$AZURE_DIR/$path" "$sourcefile"; then
                echo "Unrelated Azure file already exists: $path; refusing overwrite." >&2
                exit 1
              fi
              cp "$sourcefile" "$AZURE_DIR/$path"
            fi
          done

          git -C "$AZURE_DIR" add -- "${paths[@]}"
          git -C "$AZURE_DIR" -c core.whitespace=cr-at-eol diff --cached --check
          if git -C "$AZURE_DIR" diff --cached --quiet; then
            echo 'Preview UI already synchronized, no production change required.'
            exit 0
          fi
          git -C "$AZURE_DIR" config user.name 'AncoTrading GitHub Sync'
          git -C "$AZURE_DIR" config user.email 'actions@users.noreply.github.com'
          git -C "$AZURE_DIR" commit -m 'fix: use standard mdbc connection in PO deposit API (GitHub 3c276e38)'
          git -C "$AZURE_DIR" -c "http.extraheader=$AUTH_HEADER" push origin HEAD:refs/heads/master
          echo 'Gated preview UI synchronized to Azure production master.'
