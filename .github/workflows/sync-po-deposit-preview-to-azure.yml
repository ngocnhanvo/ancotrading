name: Open PO deposit allocation tab in Azure production

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/sync-po-deposit-preview-to-azure.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anco-po-deposit-azure-sync
  cancel-in-progress: false

jobs:
  sync-ui-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_COMMIT: 113387f91fd8ebd71e2754706a754c94ec783e81
      MERGE_BASE: e06ed8ac20b1880db83923d9915b95613df65004
      AZURE_URL: https://dev.azure.com/vongocnhancd10cntt2/AncoTrading/_git/AncoTrading
      AZURE_PAT: ${{ secrets.AZURE_DEVOPS_PAT || secrets.AZDO_PAT || secrets.ADO_PAT || secrets.AZURE_PAT || secrets.AZURE_DEVOPS_TOKEN }}
    steps:
      - name: Checkout GitHub source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate public tab source and required files
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            Views/chungtuxuatkhoNV/inc-ctxkNV.aspx
            Views/phanbococpo/phanbococpo.js
          )
          git cat-file -e "$SOURCE_COMMIT^{commit}"
          git cat-file -e "$MERGE_BASE^{commit}"
          for path in "${paths[@]}"; do
            git cat-file -e "$SOURCE_COMMIT:$path"
          done
          git show "$SOURCE_COMMIT:Views/chungtuxuatkhoNV/inc-ctxkNV.aspx" | grep -q '<li class="anco-pb-preview-tab"><a'
          if git show "$SOURCE_COMMIT:Views/chungtuxuatkhoNV/inc-ctxkNV.aspx" | grep -q 'phanbococ_preview=1' ||
             git show "$SOURCE_COMMIT:Views/phanbococpo/phanbococpo.js" | grep -q 'phanbococ_preview=1'; then
            echo 'URL feature gate is still present; refusing sync.' >&2
            exit 1
          fi
          echo 'Default-visible PO allocation tab and ungated module verified.'


      - name: Three-way merge only public tab changes into Azure master
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$AZURE_PAT" ]; then
            echo 'Missing Azure DevOps PAT secret; Azure deployment was not attempted.' >&2
            exit 1
          fi
          AUTH_HEADER="Authorization: Basic $(printf ':%s' "$AZURE_PAT" | base64 -w0)"
          AZURE_DIR="$RUNNER_TEMP/azure-production"
          git -c "http.extraheader=$AUTH_HEADER" clone --single-branch --branch master --depth 1 "$AZURE_URL" "$AZURE_DIR"

          # Apply only the two tab/module changes, preserving independent Azure edits.
          # Three-way merge conflicts abort before staging or pushing anything.
          paths=(
            Views/chungtuxuatkhoNV/inc-ctxkNV.aspx
            Views/phanbococpo/phanbococpo.js
          )
          for path in "${paths[@]}"; do
            sourcefile="$RUNNER_TEMP/new-$(echo "$path" | tr '/' '_')"
            basefile="$RUNNER_TEMP/base-$(echo "$path" | tr '/' '_')"
            mergedfile="$RUNNER_TEMP/merge-$(echo "$path" | tr '/' '_')"
            git show "$SOURCE_COMMIT:$path" > "$sourcefile"
            mkdir -p "$(dirname "$AZURE_DIR/$path")"
            if git cat-file -e "$MERGE_BASE:$path" 2>/dev/null; then
              if [ ! -f "$AZURE_DIR/$path" ]; then
                echo "Existing source file absent in Azure: $path; refusing to recreate." >&2
                exit 1
              fi
              git show "$MERGE_BASE:$path" > "$basefile"
              if ! git merge-file -p "$AZURE_DIR/$path" "$basefile" "$sourcefile" > "$mergedfile"; then
                echo "Azure merge conflict in $path; no push performed." >&2
                exit 1
              fi
              mv "$mergedfile" "$AZURE_DIR/$path"
            else
              if [ -f "$AZURE_DIR/$path" ] && ! cmp -s "$AZURE_DIR/$path" "$sourcefile"; then
                echo "Unrelated Azure file already exists: $path; refusing overwrite." >&2
                exit 1
              fi
              cp "$sourcefile" "$AZURE_DIR/$path"
            fi
          done

          git -C "$AZURE_DIR" add -- "${paths[@]}"
          git -C "$AZURE_DIR" -c core.whitespace=cr-at-eol diff --cached --check
          if git -C "$AZURE_DIR" diff --cached --quiet; then
            echo 'PO allocation tab already synchronized, no production change required.'
            exit 0
          fi
          git -C "$AZURE_DIR" config user.name 'AncoTrading GitHub Sync'
          git -C "$AZURE_DIR" config user.email 'actions@users.noreply.github.com'
          git -C "$AZURE_DIR" commit -m 'fix: open PO allocation tab without preview URL (GitHub 113387f)'
          git -C "$AZURE_DIR" -c "http.extraheader=$AUTH_HEADER" push origin HEAD:refs/heads/master
          echo 'PO allocation tab synchronized to Azure production master.'
