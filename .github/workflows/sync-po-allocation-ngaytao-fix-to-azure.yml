name: Sync PO allocation ngaytao fix to Azure master
on:
  push:
    branches: [master]
    paths:
      - .github/workflows/sync-po-allocation-ngaytao-fix-to-azure.yml
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AZURE_URL: https://dev.azure.com/vongocnhancd10cntt2/AncoTrading/_git/AncoTrading
      AZURE_PAT: ${{ secrets.AZURE_DEVOPS_PAT || secrets.AZDO_PAT || secrets.ADO_PAT || secrets.AZURE_PAT || secrets.AZURE_DEVOPS_TOKEN }}
      TARGET: Views/phanbococpo/Controller_PhanBoCocPO.ashx
    steps:
      - name: Apply exact ngaytao insert fix and push
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AZURE_PAT" || { echo 'Azure PAT missing'; exit 1; }
          AUTH="Authorization: Basic $(printf ':%s' "$AZURE_PAT" | base64 -w0)"
          DIR="$RUNNER_TEMP/azure"
          git -c "http.extraheader=$AUTH" clone --quiet --depth 1 --branch master --single-branch "$AZURE_URL" "$DIR"
          echo "AZURE_BEFORE=$(git -C "$DIR" rev-parse HEAD)"
          python3 - "$DIR/$TARGET" <<'PY'
          from pathlib import Path
          import sys
          path=Path(sys.argv[1])
          raw=path.read_bytes()
          enc='utf-8-sig' if raw.startswith(b'\xef\xbb\xbf') else 'utf-8'
          text=raw.decode(enc)
          marker='INSERT INTO dbo.c_packinginvoice_phanbo'
          old_cols='(c_packinginvoice_phanbo_id,c_packinginvoice_id,c_donhang_id,sotienphanbo,nguoitao)'
          new_cols='(c_packinginvoice_phanbo_id,c_packinginvoice_id,c_donhang_id,sotienphanbo,nguoitao,ngaytao)'
          old_vals='VALUES (@id,@invoice,@poId,@amount,@user)'
          new_vals='VALUES (@id,@invoice,@poId,@amount,@user,GETDATE())'
          if text.count(marker) != 1:
              raise RuntimeError('Expected exactly one allocation INSERT marker')
          if text.count(old_cols)==1 and text.count(old_vals)==1 and text.count(new_cols)==0 and text.count(new_vals)==0:
              insert_pos=text.index(marker)
              cols_pos=text.index(old_cols)
              vals_pos=text.index(old_vals)
              if not (insert_pos < cols_pos < vals_pos < vals_pos + len(old_vals) < insert_pos + 600):
                  raise RuntimeError('Expected allocation INSERT pieces are not in the same statement')
              text=text.replace(old_cols,new_cols,1).replace(old_vals,new_vals,1)
              path.write_bytes(text.encode(enc))
              print('AZURE_CONTROLLER_PATCHED')
          elif text.count(new_cols)==1 and text.count(new_vals)==1 and text.count(old_cols)==0 and text.count(old_vals)==0:
              print('AZURE_CONTROLLER_ALREADY_PATCHED')
          else:
              raise RuntimeError('Azure allocation INSERT differs from expected; refusing overwrite')
          PY
          git -C "$DIR" add -- "$TARGET"
          git -C "$DIR" -c core.whitespace=cr-at-eol diff --cached --check
          if git -C "$DIR" diff --cached --quiet; then echo AZURE_ALREADY_SYNCED; exit 0; fi
          test "$(git -C "$DIR" diff --cached --name-only)" = "$TARGET"
          git -C "$DIR" -c user.name='AncoTrading GitHub Sync' -c user.email='actions@users.noreply.github.com' commit -m 'fix: set allocation ngaytao on draft insert'
          git -C "$DIR" -c "http.extraheader=$AUTH" push origin HEAD:refs/heads/master
          EXPECTED="$(git -C "$DIR" rev-parse HEAD)"
          ACTUAL="$(git -c "http.extraheader=$AUTH" ls-remote "$AZURE_URL" refs/heads/master | cut -f1)"
          test "$EXPECTED" = "$ACTUAL"
          echo "AZURE_MASTER_SYNC_SUCCESS=$ACTUAL"
